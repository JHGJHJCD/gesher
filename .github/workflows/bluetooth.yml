name: bluetooth

# The Bluetooth backend (compat/devices/bluetooth*.cc, docs/bluetooth.md) on its
# own, without the AOSP build: cross-compiled with the pinned llvm-mingw and the
# framework runtime's warning flags, then run on both Windows runners. The
# runners have no radio: the probe checks that Windows' answers end cleanly
# (no adapter), and that GESHER_BLUETOOTH_TEST's radio passes every check of
# the backend interface. The full stack (WindowsBluetooth, the android.bluetooth
# classes, BluetoothManagerService) is checked by ci.yml's tests
# (tests/windows/tracks/61-bluetooth.ps1).
#
#   gh workflow run bluetooth.yml --ref <branch>
on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

env:
  LLVM_MINGW_TAG: "20261006"
  LLVM_MINGW_NAME: llvm-mingw-20261006-ucrt-ubuntu-22.04-x86_64

jobs:
  probe-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Cache llvm-mingw
        id: toolchain
        uses: actions/cache@v4
        with:
          path: ~/toolchain/${{ env.LLVM_MINGW_NAME }}
          key: ${{ env.LLVM_MINGW_NAME }}

      - name: Fetch llvm-mingw
        if: steps.toolchain.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/toolchain
          curl -fsSL "https://github.com/mstorsjo/llvm-mingw/releases/download/$LLVM_MINGW_TAG/$LLVM_MINGW_NAME.tar.xz" \
            | tar -xJ -C ~/toolchain

      - name: Build the probe with the framework runtime's flags
        run: |
          set -euo pipefail
          cxx=~/toolchain/$LLVM_MINGW_NAME/bin/x86_64-w64-mingw32-clang++
          mkdir -p dist-bluetooth
          # cmake/aosp/framework.cmake's framework_runtime warning set and the
          # top-level CMakeLists.txt definitions and options.
          "$cxx" -std=c++23 -O2 -g0 -fno-exceptions -mno-ms-bitfields \
            -Wall -Wextra -Werror -Wno-unused-parameter -Wno-non-virtual-dtor \
            -DGESHER -DUSE_MINGW -DWIN32_LEAN_AND_MEAN -DNOMINMAX -DNOGDI \
            -D_WIN32_WINNT=0x0A00 -DWINVER=0x0A00 \
            -Icompat/devices \
            tests/bluetooth/bluetooth_probe.cc compat/devices/bluetooth.cc \
            compat/devices/bluetooth_win.cc compat/devices/bluetooth_test.cc \
            compat/devices/winrt.cc \
            -static -lws2_32 -lole32 -luuid \
            -o dist-bluetooth/bluetooth_probe.exe
          ~/toolchain/$LLVM_MINGW_NAME/bin/llvm-readobj --coff-imports dist-bluetooth/bluetooth_probe.exe \
            | grep -E "Name: " | sort -u | tee dist-bluetooth/imports.txt
          # Windows' Bluetooth DLLs and combase are found at run time, never imported.
          if grep -qiE "bluetoothapis|bthprops|combase" dist-bluetooth/imports.txt; then
            echo "the probe imports a Bluetooth/WinRT DLL directly" >&2
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: bluetooth-probe
          path: dist-bluetooth/

  probe-run:
    needs: probe-build
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: bluetooth-probe
          path: dist

      - name: Windows' answers without a radio
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist/bluetooth_probe.exe -ArgumentList '--inquiry' -NoNewWindow -PassThru `
            -RedirectStandardOutput host.txt -RedirectStandardError host-err.txt
          if (-not $p.WaitForExit(120000)) { $p.Kill($true); throw 'the probe did not end in 120 s' }
          Get-Content host.txt, host-err.txt
          if ($p.ExitCode -ne 0) { throw "exit $($p.ExitCode)" }
          $out = Get-Content host.txt -Raw
          if ($out -notmatch 'bluetooth-probe: adapter present \d') { throw 'no adapter line' }
          if ($out -notmatch 'bluetooth-probe: done') { throw 'the probe did not finish' }
          Get-PnpDevice -Class Bluetooth -ErrorAction SilentlyContinue | Format-Table -AutoSize | Out-String | Write-Host

      - name: GESHER_BLUETOOTH_TEST's radio through the backend interface
        shell: pwsh
        run: |
          $env:GESHER_BLUETOOTH_TEST = '1'
          $p = Start-Process -FilePath dist/bluetooth_probe.exe -ArgumentList '--check' -NoNewWindow -PassThru `
            -RedirectStandardOutput test.txt -RedirectStandardError test-err.txt
          if (-not $p.WaitForExit(120000)) { $p.Kill($true); throw 'the probe did not end in 120 s' }
          Get-Content test.txt, test-err.txt
          if ($p.ExitCode -ne 0) { throw "exit $($p.ExitCode)" }
          if ((Get-Content test.txt -Raw) -notmatch 'bluetooth-probe: 0 failure\(s\)') { throw 'checks failed' }
