name: graphicsdex-trusted-source
on:
  workflow_call:
    outputs:
      pins: {value: '${{ jobs.verify.outputs.pins }}'}
      guard: {value: '${{ jobs.verify.outputs.guard }}'}
      caller: {value: '${{ jobs.verify.outputs.caller }}'}
permissions:
  contents: read
  actions: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      pins: ${{ steps.source.outputs.pins }}
      guard: ${{ steps.source.outputs.guard }}
      caller: ${{ steps.source.outputs.caller }}
    env:
      GH_TOKEN: ${{ github.token }}
      GRAPHICSDEX_CALLER_COMMIT: ${{ vars.GRAPHICSDEX_CALLER_COMMIT }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0, persist-credentials: false}
      - name: Verify immutable source and caller
        id: source
        shell: bash
        run: |
          python -I -B - <<'PY'
          import hashlib,subprocess
          from pathlib import Path
          PINS={'tools/ci_graphics_processes/api_context.py': 'e930e2f315f85d647eaa8017b932916dce82a82a', 'tools/ci_graphics_processes/bridge.py': '46e31800bd0b8e3ac4d4acfd46b0fb56155f67f7', 'tools/ci_graphics_processes/bridge_cli.py': '27161f4c7a57ed0e015ff52d1b36ef481bf2e2c8', 'tools/ci_graphics_processes/manifest.py': '950f1e149ae41efe8b01cc11f8962fa163fc55fc', 'tools/ci_graphics_processes/role_checks.py': '780fabcb2654e44ab8042b26ea399a81d4f4be4b', 'tools/ci_graphics_processes/run-fixture.ps1': '8da7831c5c73b541442650bc2b0495c205d38f43', 'tools/ci_graphics_processes/source_guard.py': '803b23396f851a8203b76f0c4ff679ca284b1340', 'tools/ci_graphics_processes/test_api_context.py': '8cfa1f7f64ff0306bb8406e8b59a80727cd1d8e8', 'tools/ci_graphics_processes/test_bridge.py': '39ceefc9c47eae089bb6009e41111430f649dcc1', 'tools/ci_graphics_processes/test_manifest.py': '817b7f581e9229d3ee5b5362a6669067e811c018', 'tools/ci_graphics_processes/test_role_checks.py': '8e47a1c333d89ff8d196ac4d2e7ae6a042bddaf6', 'tools/ci_graphics_processes/test_source_guard.py': '5350f7a94d9d3229ae178d3d72a8f58aa4467498', 'tools/ci_graphics_processes/test_workflow_templates.py': '420d2b3c91d8428eab058f6bfa65fa8d6c0078dc', 'tools/ci_graphics_processes/workflow_templates.py': '058cda704ef8b909a567fbdebe2d9edba7486514'}
          TEMPLATE='924cae272b4fe81904aac945a11ebbdfcfdda82a'
          path='tools/ci_graphics_processes/source_guard.py'
          raw=subprocess.check_output(['git','cat-file','blob',PINS[path]])
          assert hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()==PINS[path]
          scope={'__name__':'pinned_source_guard','__file__':str(Path(path).resolve())}
          exec(compile(raw,'pinned-source-guard','exec'),scope)
          scope['guard_main'](PINS,TEMPLATE)
          PY
      - name: Run pure source and identity controls
        shell: bash
        run: |
          set -e
          for test in test_manifest.py test_role_checks.py test_source_guard.py test_api_context.py test_bridge.py test_workflow_templates.py; do
            python -I -B "tools/ci_graphics_processes/$test"
          done
