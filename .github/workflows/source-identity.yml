name: source-identity

# A local reusable call makes GitHub record this run's immutable source SHA
# and refs/pull/<number>/merge in referenced_workflows. No checkout is needed.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  identity:
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps:
      - run: echo "SOURCE_IDENTITY source=${{ github.sha }}"
